// ===== Student Profile (Month Wise / Subject Wise) =====
function subjectsForRoll(roll){
  return [...new Set(DATA.marks.filter(m=>m.roll===roll).map(m=>m.subject))];
}
function subjectAvgAllMonths(roll, subject){
  const rows = DATA.marks.filter(m=>m.roll===roll && m.subject===subject);
  const max = rows.reduce((s,r)=>s+Number(r.max||0),0);
  const obt = rows.reduce((s,r)=>s+Number(r.obtained||0),0);
  return max>0 ? obt/max : 0;
}
function studentProfileHubView(){
  const filteredStudents = DATA.students.filter(s=>
    (!profileFilterStandard || s.standard===profileFilterStandard) &&
    (!profileFilterStream || s.stream===profileFilterStream));
  if(profileSelectedRoll===null || profileSelectedRoll===undefined || !filteredStudents.some(s=>s.id===profileSelectedRoll)){
    profileSelectedRoll = filteredStudents.length ? filteredStudents[0].id : null;
  }
  const standardOpts = ['', ...sortStandards([...new Set(DATA.students.map(s=>s.standard).filter(Boolean))])]
    .map(v=>`<option value="${escapeHtml(v)}" ${v===profileFilterStandard?'selected':''}>${escapeHtml(v)||'All standards'}</option>`).join('');
  const streamOpts = ['', ...new Set(DATA.students.map(s=>s.stream).filter(Boolean))]
    .map(v=>`<option value="${escapeHtml(v)}" ${v===profileFilterStream?'selected':''}>${escapeHtml(v)||'All streams'}</option>`).join('');
  const studentOpts = filteredStudents.map(s=>`<option value="${escapeHtml(s.id)}" ${s.id===profileSelectedRoll?'selected':''}>${escapeHtml(s.roll)} - ${escapeHtml(s.name)}</option>`).join('');

  const filterCard = `
  <div class="card no-print">
    <h2>Student Profile</h2>
    <div class="row">
      <div class="field"><label>Standard</label><select onchange="profileFilterStandard=this.value;profileSelectedRoll=null;render()">${standardOpts}</select></div>
      <div class="field"><label>Stream</label><select onchange="profileFilterStream=this.value;profileSelectedRoll=null;render()">${streamOpts}</select></div>
      <div class="field" style="min-width:220px"><label>Student</label>
        <select onchange="profileSelectedRoll=Number(this.value);render()">${filteredStudents.length?studentOpts:'<option value="">No student in this filter</option>'}</select>
      </div>
      <div class="field">

          <button class="btn ${profileSubTab==='subjectwise'?'':'secondary'}" onclick="setProfileSubTab('subjectwise')">Subject Wise</button>
          <button class="btn ${profileSubTab==='unittestwise'?'':'secondary'}" onclick="setProfileSubTab('unittestwise')">Unit Test Wise</button>
        </div>
      </div>
      <button class="btn secondary" onclick="printStudentProfile()" ${profileSelectedRoll===null?'disabled':''}>Print this report</button>
    </div>
  </div>`;

  if(!filteredStudents.length || profileSelectedRoll===null){
    return filterCard + '<div class="card"><div class="empty">Is standard/stream me koi student nahi hai.</div></div>';

  const s = DATA.students.find(x=>x.id===profileSelectedRoll);
  const classLine = s ? [s.standard, s.stream].filter(Boolean).join(' ') : '';
  const overall = overallAvgAllMonths(profileSelectedRoll);
  const summaryCard = `
  <div class="card">
    <h2>${escapeHtml(s?s.name:'')}</h2>
    <div class="pct" style="font-size:14px;margin-top:-8px;margin-bottom:4px">Roll No ${escapeHtml(s?s.roll:'')}${classLine?' &nbsp;&bull;&nbsp; '+escapeHtml(classLine):''}${overall!==null?' &nbsp;&bull;&nbsp; Overall <span class="grade grade-'+escapeHtml(gradeFor(overall))+'">'+escapeHtml(gradeFor(overall))+'</span> ('+Math.round(overall*100)+'%)':''}</div>
  </div>`;

  return filterCard + summaryCard + (profileSubTab==='monthwise' ? profileMonthWiseView(profileSelectedRoll)
    : profileSubTab==='subjectwise' ? profileSubjectWiseView(profileSelectedRoll)
    : profileUnitTestWiseView(profileSelectedRoll));
}
function overallAvgAllMonths(roll){
  const rows = DATA.marks.filter(m=>m.roll===roll);
  const max = rows.reduce((s,r)=>s+Number(r.max||0),0);
  const obt = rows.reduce((s,r)=>s+Number(r.obtained||0),0);
  return max>0 ? obt/max : null;
}
function profileMonthWiseView(roll){
  const t = trendDataFor(roll);
  const hasData = t.marksSeries.some(v=>v!==null);
  return `

}
function profileSubjectWiseView(roll){
  const subs = subjectsForRoll(roll);
  return `
  <div class="card">

function testsForRoll(roll){
  const tests = [...new Set(DATA.marks.filter(m=>m.roll===roll).map(m=>m.test).filter(Boolean))];
  return tests.sort((a,b)=>a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
}
function profileUnitTestWiseView(roll){
  const tests = testsForRoll(roll);
  if(!tests.length){
    return `<div class="card"><h2>Unit Test Wise Performance</h2><div class="empty">Is student ke liye abhi tak koi unit test ka marks entry nahi hai.</div></div>`;
  }
  let sr = 0;
  const rows = tests.map(test=>{
    const marks = DATA.marks.filter(m=>m.roll===roll && m.test===test);
    return marks.map(r=>{
      sr++;
      const pct = (!r.absent && r.max>0) ? Math.round(r.obtained/r.max*100) : null;
      return `<tr>
        <td style="text-align:center">${sr}</td>

        <td class="pct" style="text-align:center">${pct!==null?pct+'%':'—'}</td>
      </tr>`;
    }).join('');
  }).join('');
  return `
  <div class="card">
    <h2>Unit Test Wise Performance</h2>
    <div class="table-wrap"><table>
      <tr><th style="text-align:center">Sr No.</th><th>Unit Test Name</th><th style="text-align:center">Exam Date</th><th>Subject</th><th>Chapter</th><th>Topic</th><th style="text-align:center">Max. Marks</th><th style="text-align:center">Obtained Marks</th><th style="text-align:center">Percentage</th></tr>
      ${rows}
    </table></div>
  </div>`;
}

let selectedTestName = '';
let selectedTestStandard = '';
let selectedTestStream = '';

// Jab bhi koi naya test naam pehli baar use hota he, usko creation-sequence me record kar leta he,
// taaki old-to-new order test ke naam pe guess kiye bina, actual creation order se pata chale.
function recordTestOrder(testName){
  if(!DATA.testOrder) DATA.testOrder = [];
  if(!DATA.testOrder.includes(testName)) DATA.testOrder.push(testName);
}
// Test names ko unke actual creation order me (old to new) return karta he. Purane data (jinke liye
// testOrder record nahi tha) ke naam list ke end me natural/numeric sort se add ho jaate hain.
function allTestNames(){
  const allNames = [...new Set(DATA.marks.map(m=>m.test).filter(Boolean))];
  const tracked = (DATA.testOrder||[]).filter(n=>allNames.includes(n));
  const untracked = allNames.filter(n=>!tracked.includes(n))
    .sort((a,b)=>a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
  return [...tracked, ...untracked];
}

// Rank ko colorful medal-style badge me dikhata he - top 3 ranks gold/silver/bronze
function rankBadge(rank){
  const cls = rank===1 ? 'rank-1' : rank===2 ? 'rank-2' : rank===3 ? 'rank-3' : '';
  return `<span class="rankbadge ${cls}">${rank}</span>`;
}

// Test select hote hi standard/stream aur total marks auto-detect karta he, aur students ko total obtained marks ke hisab se rank deta he
function unitTestSummary(testName, filteredStudents, subs){
  const takers = filteredStudents.filter(s=>DATA.marks.some(m=>m.roll===s.id && m.test===testName));
  const testStandards = [...new Set(takers.map(s=>s.standard).filter(Boolean))];
  const testStreams = [...new Set(takers.map(s=>s.stream).filter(Boolean))];
  const classLine = [testStandards.join(' / '), testStreams.join(' / ')].filter(Boolean).join(' &nbsp;&bull;&nbsp; ');

  // Per-subject max marks (shown in each column header) + running total
  const subjectMax = {};
  subs.forEach(sub=>{
    const rec = DATA.marks.find(m=>m.test===testName && m.subject===sub);
    subjectMax[sub] = Number(rec ? (rec.max||0) : 0);
  });
  const totalMaxMarks = subs.reduce((sum, sub)=> sum + subjectMax[sub], 0);

  // Common exam date across this test's records (blank if subjects were held on different dates)
  const testDates = [...new Set(DATA.marks.filter(m=>m.test===testName).map(m=>examDateDisplay(m)))];
  const examDate = testDates.length===1 ? testDates[0] : '';

  const studentRows = filteredStudents.map(s=>{
    let totalObt = 0, hasAny = false, anyPresent = false;
    const marksMap = {};
    subs.forEach(sub=>{
      const rec = DATA.marks.find(m=>m.roll===s.id && m.test===testName && m.subject===sub);
      if(rec){
        hasAny = true;
        if(rec.absent){ marksMap[sub] = 'AB'; }
        else { totalObt += Number(rec.obtained||0); marksMap[sub] = rec.obtained; anyPresent = true; }
      } else {
        marksMap[sub] = '-';
      }
    });
    const pct = (totalMaxMarks>0 && anyPresent) ? (totalObt/totalMaxMarks) : null;
    return { roll: s.roll, name: s.name, totalObt, hasAny, marksMap, pct };
  }).filter(r=>r.hasAny);

  const sorted = [...studentRows].sort((a,b)=> b.totalObt - a.totalObt);
  let rank = 0, prevScore = null;
  const rankRows = sorted.map((r)=>{
    if(r.totalObt !== prevScore){ rank++; prevScore = r.totalObt; }
    const grade = r.pct!==null ? gradeFor(r.pct) : null;
    return { ...r, rank, grade };
  });

  // Class-level stats for the summary strip
  const scored = rankRows.filter(r=>r.pct!==null);
  const classAvgPct = scored.length ? Math.round(scored.reduce((s,r)=>s+r.pct,0)/scored.length*100) : null;
  const highest = scored.length ? scored.reduce((a,b)=> b.totalObt>a.totalObt?b:a) : null;
  const lowest = scored.length ? scored.reduce((a,b)=> b.totalObt<a.totalObt?b:a) : null;

  return { classLine, totalMaxMarks, subjectMax, examDate, rankRows, classAvgPct, highest, lowest, appeared: rankRows.length };
}

function printUnitTestReport(){
  const html = buildUnitTestPrintDoc(selectedTestName);
  printHtmlDoc(html);

function showAuthScreen(){
  applyAuthModeUi();
  document.getElementById('authLoading').style.display='none';
  document.getElementById('appRoot').style.display='none';
  document.getElementById('authScreen').style.display='flex';
}
function showApp(){
  document.getElementById('authLoading').style.display='none';
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appRoot').style.display='block';
  document.getElementById('userChip').textContent = currentUser ? currentUser.email : '';
}
// Sab accounts ban jaane ke baad ise false kar do taaki koi naya banda signup na kar sake.
// (Firebase Console > Authentication > Settings me bhi signup restrict kar sakte ho.)
const ALLOW_SIGNUP = true;
const MIN_PASSWORD_LEN = 8;

function authErrorMessage(e){
  const code = (e && e.code) || '';
  const map = {
    'auth/invalid-email': 'Email sahi format me daalo.',
    'auth/user-not-found': 'Is email se koi account nahi mila.',
    'auth/wrong-password': 'Email ya password galat he.',
    'auth/invalid-credential': 'Email ya password galat he.',
    'auth/invalid-login-credentials': 'Email ya password galat he.',
    'auth/email-already-in-use': 'Is email se account pehle se bana hua he. Login karo.',
    'auth/weak-password': 'Password kam se kam ' + MIN_PASSWORD_LEN + ' character ka rakho.',
    'auth/too-many-requests': 'Bahut zyada koshish ho gayi. Thodi der baad dobara try karo.',
    'auth/network-request-failed': 'Internet connection check karo aur dobara try karo.',
    'auth/user-disabled': 'Ye account band kar diya gaya he.',
    'auth/operation-not-allowed': 'Ye option abhi allowed nahi he.'
  };
  return map[code] || 'Kuch galat ho gaya. Dobara try karo. (' + (code || (e && e.message) || 'unknown') + ')';
}
function showAuthError(msg){
  const errBox = document.getElementById('authErr');
  errBox.textContent = msg;
  errBox.style.display = 'block';
}
function applyAuthModeUi(){
  const login = authMode === 'login';
  document.getElementById('authTitle').textContent = login ? 'Login' : 'Sign up';
  document.getElementById('authSub').textContent = login
    ? 'Apne account se login karo — data har device par sync rahega.'
    : 'Naya account banao — is email/password se kisi bhi device par login kar sakte ho.';
  document.getElementById('authSubmitBtn').textContent = login ? 'Login' : 'Sign up';
  document.getElementById('authPassword').setAttribute('autocomplete', login ? 'current-password' : 'new-password');
  document.getElementById('authForgot').style.display = login ? '' : 'none';
  const tg = document.getElementById('authToggle');
  tg.style.display = ALLOW_SIGNUP ? '' : 'none';
  tg.innerHTML = login
    ? 'Naya account banana hai? <a onclick="toggleAuthMode()">Sign up</a>'
    : 'Pehle se account hai? <a onclick="toggleAuthMode()">Login</a>';
  document.getElementById('authErr').style.display = 'none';
}
function toggleAuthMode(){
  if(!ALLOW_SIGNUP && authMode === 'login') return;
  authMode = authMode === 'login' ? 'signup' : 'login';
  applyAuthModeUi();
}
let authBusy = false;
async function submitAuth(){
  if(authBusy) return;
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const btn = document.getElementById('authSubmitBtn');
  document.getElementById('authErr').style.display = 'none';
  if(!email || !password){ showAuthError('Email aur password dono bharo.'); return; }
  if(authMode === 'signup'){
    if(!ALLOW_SIGNUP){ showAuthError('Naye account abhi band hain.'); return; }
    if(password.length < MIN_PASSWORD_LEN){ showAuthError('Password kam se kam ' + MIN_PASSWORD_LEN + ' character ka rakho.'); return; }
  }
  authBusy = true; btn.disabled = true;
  const label = btn.textContent; btn.textContent = 'Please wait...';
  try{
    if(authMode === 'login'){
      await auth.signInWithEmailAndPassword(email, password);
    } else {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      try{ await cred.user.sendEmailVerification(); toast('Account ban gaya. Verification email bhej diya — inbox/spam check karo.'); }catch(_){}
    }
  }catch(e){
    showAuthError(authErrorMessage(e));
  }finally{
    authBusy = false; btn.disabled = false; btn.textContent = label;
  }
}
async function forgotPassword(){
  const email = document.getElementById('authEmail').value.trim();
  document.getElementById('authErr').style.display = 'none';
  if(!email){ showAuthError('Pehle upar email bharo, phir "Password bhool gaye?" dabao.'); return; }
  try{
    await auth.sendPasswordResetEmail(email);
    toast('Password reset link ' + email + ' par bhej diya. Spam folder bhi check karo.');
  }catch(e){
    showAuthError(authErrorMessage(e));
  }
}
function logoutUser(){
  if(!confirm('Logout karna hai?')) return;
  auth.signOut();
}

['authEmail','authPassword'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown', e=>{ if(e.key === 'Enter') submitAuth(); });
});
linkLabels();

auth.onAuthStateChanged(async (user)=>{
  document.getElementById('authLoading').style.display='block';
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appRoot').style.display='none';
  currentUser = user;
  if(user){
    DATA = { students: [], marks: [], attendance: {}, workingDays: {}, dailyAttendance: {}, remarks: {}, subjects: [], school: { name:'', address:'', mobile:'', logo:'' } };
    await loadData();
    showApp();
    render();
  } else {
    showAuthScreen();
  }
});
</script>
