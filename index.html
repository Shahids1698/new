<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Report Generator - Month Wise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --primary:#4f3cc9; --primary-dark:#372a94; --primary-light:#7d6cf0;
  --teal:#0ea5a5; --accent:#f5a524; --rose:#e2436b; --green:#1a9c6b;
  --ink:#241c4d; --ink-dark:#150f36; --paper:#f3f2fb; --card:#ffffff;
  --line:#e7e4f7; --muted:#716c94; --gold:#f5a524; --red:#e2436b;
}
*{box-sizing:border-box}
body{margin:0}
.app{font-family:'Inter',Arial,sans-serif;
  background:
    radial-gradient(circle at 12% -10%, #ece7fd 0%, transparent 42%),
    radial-gradient(circle at 100% 0%, #e2f6f3 0%, transparent 38%),
    var(--paper);
  color:var(--ink);min-height:100vh}
.topbar{background:linear-gradient(120deg,var(--primary) 0%,#6a4fe0 55%,#8a3fd6 100%);color:#fff;padding:20px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 4px 20px rgba(79,60,201,.28)}
.topbar h1{font-family:'Sora',sans-serif;font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:12px}
.topbar h1 .logo-mark{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar h1 small{display:block;font-size:11px;color:#e6dfff;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
nav{display:flex;gap:6px;background:#fff;border-bottom:1px solid var(--line);padding:10px 26px;box-shadow:0 2px 10px rgba(36,28,77,.04);flex-wrap:wrap}
nav button{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;padding:9px 16px;border:none;border-radius:20px;background:none;cursor:pointer;color:var(--muted);transition:all .15s ease}
nav button:hover{background:#f1eefc;color:var(--primary)}
nav button.active{color:#fff;background:linear-gradient(120deg,var(--primary),var(--primary-light));box-shadow:0 3px 10px rgba(79,60,201,.35)}
.nav-dropdown{position:relative}
.nav-dropdown-menu{display:none;position:absolute;top:100%;left:0;padding-top:6px;z-index:20}
.nav-dropdown-menu-inner{background:#fff;border:1px solid var(--line);border-radius:12px;min-width:170px;box-shadow:0 14px 30px rgba(36,28,77,.16);padding:6px}
.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown.open .nav-dropdown-menu{display:block}
.nav-sub{position:relative}
.nav-sub>.nav-flyout{display:none;position:absolute;left:100%;top:-7px;padding-left:6px;z-index:21}
.nav-sub:hover>.nav-flyout,.nav-sub.open>.nav-flyout{display:block}
.nav-sub-btn.sub-active{color:var(--primary);background:#f1eefc}
.nav-arrow{float:right;margin-left:14px;opacity:.6}
@media(max-width:700px){.nav-sub>.nav-flyout{position:static;padding:0 0 0 12px}.nav-sub:hover>.nav-flyout{display:none}.nav-sub.open>.nav-flyout{display:block}}
.nav-dropdown-menu button{display:block;width:100%;text-align:left;padding:9px 14px;border-radius:8px;color:var(--muted);font-weight:500}
.nav-dropdown-menu button:hover{background:#f1eefc;color:var(--primary)}
.nav-dropdown-menu button.active{color:#fff;background:linear-gradient(120deg,var(--primary),var(--primary-light));font-weight:600}
main{padding:26px;max-width:1000px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin-bottom:20px;box-shadow:0 2px 16px rgba(36,28,77,.05)}
.card details{border-radius:14px}
.card summary.section-summary{list-style:none;cursor:pointer;padding:20px 26px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card summary.section-summary::-webkit-details-marker{display:none}
.card summary.section-summary::after{content:'';width:9px;height:9px;border-right:2px solid var(--primary);border-bottom:2px solid var(--primary);transform:rotate(-45deg);transition:transform .15s ease;flex-shrink:0}
.card details[open] summary.section-summary::after{transform:rotate(45deg)}
.card details[open] summary.section-summary{border-bottom:2px solid var(--line)}
.card .section-body{padding:18px 26px 22px}
.card summary.section-summary h2::after{display:none}
.card h2{font-family:'Sora',sans-serif;font-size:17.5px;margin:0 0 16px;color:var(--ink);border-bottom:2px solid var(--line);padding-bottom:10px;font-weight:700;position:relative}
.card h2::after{content:'';position:absolute;left:0;bottom:-2px;width:44px;height:2px;background:linear-gradient(120deg,var(--primary),var(--teal))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
input,select{font-family:'Inter',sans-serif;font-size:15.5px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fbfaff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,60,201,.12)}
button.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;padding:9px 18px;border-radius:9px;border:none;background:linear-gradient(120deg,var(--primary),var(--primary-light));color:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(79,60,201,.25);transition:transform .1s ease,box-shadow .15s ease}
button.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,60,201,.32)}
button.btn:active{transform:translateY(0)}
button.btn.secondary{background:#fff;color:var(--primary);border:1.5px solid var(--line);box-shadow:none}
button.btn.secondary:hover{border-color:var(--primary);background:#f6f4ff}
button.btn.danger{background:#fff;color:var(--rose);border:1.5px solid #f6d4dd;box-shadow:none}
button.btn.danger:hover{background:#fef1f4;border-color:var(--rose)}
button.btn.ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);color:#fff;box-shadow:none}
button.btn.ghost:hover{background:rgba(255,255,255,.26)}
table{width:100%;border-collapse:collapse;font-family:'Inter',sans-serif;font-size:14.5px}
th{text-align:left;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--primary);background:#f6f4ff;padding:10px}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
table tr:hover td{background:#faf9ff}
.pct{color:var(--muted);font-size:13px}
.dash-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.dash-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 2px 16px rgba(36,28,77,.05)}
.dash-card .dc-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.dash-card .dc-value{font-family:'Sora',sans-serif;font-size:26px;font-weight:700;color:var(--primary);margin:6px 0 2px}
.dash-card .dc-sub{font-size:12.5px;color:var(--muted)}
.dash-card.good .dc-value{color:var(--green)} .dash-card.bad .dc-value{color:var(--rose)}
.dash-bar{height:8px;border-radius:6px;background:#eceaf8;min-width:90px;overflow:hidden}
.dash-bar>i{display:block;height:100%;background:linear-gradient(120deg,var(--primary),var(--teal))}
.dash-chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;background:#fdeaf0;color:var(--rose)}

.empty{color:var(--muted);font-family:'Inter',sans-serif;font-size:14.5px;padding:16px 0;text-align:center}
.beh-chip{display:inline-flex;align-items:center;margin:2px 4px 2px 0;padding:2px 4px;border:1px solid var(--border,#ddd);border-radius:6px}
.star-picker{display:inline-flex;gap:1px}
.star-pick{cursor:pointer;font-size:30px;color:#d3d3d3;line-height:1;transition:transform .1s}
.star-pick.filled{color:#f5b301}
.star-pick:hover{transform:scale(1.15)}
.star-readonly{color:#f5b301;font-size:15px;letter-spacing:1px}
.grade{display:inline-block;font-family:'Inter',sans-serif;font-weight:700;padding:3px 11px;border-radius:20px;font-size:12.5px}
.grade-A\+,.grade-A{background:linear-gradient(120deg,#d6f5e8,#c3f0dc);color:#0d7a4f}
.grade-B{background:linear-gradient(120deg,#fdecc8,#fbe3ad);color:#a5690a}
.grade-C,.grade-D{background:linear-gradient(120deg,#fbdbe3,#f8c9d5);color:#b8264a}
.tag-absent{display:inline-block;font-family:'Inter',sans-serif;font-weight:700;padding:3px 11px;border-radius:20px;font-size:12.5px;background:linear-gradient(120deg,#fbdbe3,#f8c9d5);color:#b8264a}
.rankbadge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:50%;font-family:'Sora',sans-serif;font-weight:700;font-size:13.5px;background:#efecfb;color:var(--primary)}
.rankbadge.rank-1{background:linear-gradient(135deg,#ffd76a,#f5a524);color:#5a3a00;box-shadow:0 2px 8px rgba(245,165,36,.4)}
.rankbadge.rank-2{background:linear-gradient(135deg,#e6eaf0,#b9c0cc);color:#3c4351;box-shadow:0 2px 8px rgba(150,160,180,.35)}
.rankbadge.rank-3{background:linear-gradient(135deg,#eabd94,#c8814a);color:#4a2a0c;box-shadow:0 2px 8px rgba(200,129,74,.35)}
.star-card{border:2px solid var(--accent)!important;box-shadow:0 12px 34px rgba(245,165,36,.28)!important}
.star-badge{display:inline-block;font-family:'Sora',sans-serif;font-weight:800;font-size:12px;letter-spacing:.4px;color:#5a3a00;background:linear-gradient(135deg,#ffe9b8,#ffd76a);padding:5px 14px;border-radius:20px}
.star-spotlight{position:relative;overflow:hidden;border-radius:22px;margin-bottom:20px;background:linear-gradient(135deg,#241c4d 0%,#3d2d84 48%,#7a3fc2 100%);box-shadow:0 20px 46px rgba(36,28,77,.38)}
.star-spotlight::before{content:'';position:absolute;top:-70px;right:-50px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(245,165,36,.38),transparent 70%);pointer-events:none}
.star-spotlight::after{content:'';position:absolute;bottom:-90px;left:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(14,165,165,.28),transparent 70%);pointer-events:none}
.star-ribbon{position:relative;display:inline-block;font-family:'Sora',sans-serif;font-weight:800;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:#5a3a00;background:linear-gradient(135deg,#ffe9b8,#f5a524);padding:7px 18px;border-radius:0 0 12px 0;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.star-spotlight-inner{position:relative;padding:6px 30px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.star-orb{flex-shrink:0;width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#ffe9b8,#f5a524);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:30px;color:#5a3a00;box-shadow:0 0 0 5px rgba(255,255,255,.14),0 12px 26px rgba(245,165,36,.4)}
.star-info{flex:1;min-width:200px}
.star-info .star-eyebrow{font-family:'Inter',sans-serif;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:#cdc2fb;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.star-info .star-name{font-family:'Fraunces',serif;font-size:25px;color:#fff;font-weight:600;margin:0}
.star-info .star-sub{font-family:'Inter',sans-serif;font-size:12.5px;color:#cdc2fb;margin-top:5px;line-height:1.5;max-width:420px}
.star-rings{position:relative;display:flex;gap:16px;flex-wrap:wrap;padding:2px 30px 26px}
.star-ring{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 16px 13px;flex:1 1 130px}
.star-ring .ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.star-ring .ring span{background:#2b2260;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:13.5px;color:#fff}
.star-ring .ring-label{font-family:'Inter',sans-serif;font-size:11px;color:#cdc2fb;text-transform:uppercase;letter-spacing:.6px;font-weight:600;text-align:center}
.reportcard{background:#fff;border-radius:16px;overflow:hidden;padding:0;margin:0 auto 22px;width:100%;max-width:720px;box-shadow:0 10px 32px rgba(36,28,77,.14);border:1px solid var(--line)}
.rc-head{background:linear-gradient(120deg,var(--primary) 0%,#6a4fe0 60%,#0ea5a5 135%);color:#fff;padding:22px 28px}
.rc-head-top{display:flex;align-items:center;gap:14px;text-align:left}
.rc-head-top .rc-logo{flex-shrink:0}
.rc-head .school{font-family:'Fraunces',serif;font-size:22px;letter-spacing:.3px;margin:0;font-weight:600}
.rc-head .school-sub{font-family:'Inter',sans-serif;font-size:12px;color:#e6dfff;margin:4px 0 0;line-height:1.5}
.rc-head h2{font-family:'Fraunces',serif;margin:14px 0 0;font-size:17.5px;letter-spacing:1px;font-weight:600;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.25);padding-top:10px;text-align:center}
.rc-head p{margin:3px 0 0;font-family:'Inter',sans-serif;font-size:12.5px;color:#e6dfff;text-transform:uppercase;letter-spacing:1px}
.rc-body{padding:22px 28px}
.rc-student{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--line);padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap;gap:8px}
.rc-student .name{font-family:'Fraunces',serif;font-size:23px;color:var(--ink);font-weight:600}
.rc-student .roll{font-family:'Inter',sans-serif;font-size:13.5px;color:var(--muted)}
.rc-section-title{font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:1px;color:#fff;background:linear-gradient(120deg,var(--primary),var(--teal));display:inline-block;padding:4px 12px;border-radius:20px;margin-bottom:12px}
.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.rc-charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:8px}
.chartbox{position:relative;height:190px}
.rc-remarks{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--muted)}
.rc-remarks textarea{width:100%;min-height:54px;font-family:'Inter',sans-serif;font-size:14.5px;border:1.5px solid var(--line);border-radius:8px;padding:9px;resize:vertical;color:var(--ink)}
.select-roll{display:flex;gap:10px;align-items:center;margin-bottom:18px;font-family:'Inter',sans-serif;flex-wrap:wrap}
.printbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stat-row{display:flex;gap:12px;font-family:'Inter',sans-serif;font-size:13.5px;margin-bottom:12px;flex-wrap:wrap}
.stat-row div{background:#f6f4ff;padding:8px 14px;border-radius:9px;border-left:3px solid var(--primary);font-weight:500}
.stat-row div:nth-child(1){border-left-color:var(--teal);background:#eafaf8}
.stat-row div:nth-child(2){border-left-color:var(--rose);background:#fdeef1}
.stat-row div:nth-child(3){border-left-color:var(--primary);background:#f2effc}
.stat-row div:nth-child(4){border-left-color:var(--accent);background:#fef6e8}
.stat-row b{color:var(--ink)}
.ut-info-strip{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 18px}
.ut-info-item{flex:1 1 130px;background:#f6f4ff;border-left:3px solid var(--primary);border-radius:8px;padding:8px 12px}
.ut-info-label{display:block;font-family:'Inter',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.ut-info-value{display:block;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:var(--ink)}
.ut-syllabus{margin-bottom:18px}
.ut-syllabus-title{display:inline-block;font-family:'Inter',sans-serif;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--primary);background:#f1eefc;padding:4px 12px;border-radius:20px;margin-bottom:8px}
.ut-table th .sub-max{display:block;font-weight:500;font-size:10.5px;opacity:.75;text-transform:none;letter-spacing:0;margin-top:1px}
.ut-table tbody tr:nth-child(even) td{background:#faf9ff}
.ut-table th{white-space:nowrap}
.ut-table td:nth-child(3){text-align:left;font-weight:600}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  .topbar,nav,.printbar,.select-roll,.no-print{display:none!important}
  main{padding:0;max-width:none}
  .reportcard{border:none;border-radius:0;box-shadow:none;max-width:100%}
  .reportcard + .reportcard{page-break-before:always}
  body{background:#fff}
  .app{background:#fff}
  thead{display:table-header-group}
  tbody tr{page-break-inside:avoid;break-inside:avoid}
}
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-wrap table{min-width:480px}
@media (max-width:780px){
  main{padding:16px}
  .card{padding:16px}
  .topbar{padding:14px 16px}
  .topbar h1{font-size:17px}
  .topbar h1 .logo-mark{width:30px;height:30px}
  nav{padding:8px 10px}
  nav button{padding:8px 12px;font-size:13.5px}
  .row{gap:10px}
  .field{flex:1 1 140px}
  input,select{width:100%;font-size:15px}
  table{font-size:13px}
  th,td{padding:8px 7px}
  .rc-head{padding:16px 18px}
  .rc-body{padding:16px 18px}
  .rc-grid{grid-template-columns:1fr;gap:14px}
  .rc-charts{grid-template-columns:1fr;gap:14px}
  .chartbox{height:170px}
  .rc-student{flex-direction:column;align-items:flex-start;gap:4px}
  .rc-student .name{font-size:20px}
  .stat-row{gap:8px}
  .stat-row div{flex:1 1 auto;padding:7px 10px;font-size:12.5px}
  .star-spotlight-inner{padding:6px 18px 18px;gap:14px}
  .star-orb{width:60px;height:60px;font-size:24px}
  .star-info .star-name{font-size:21px}
  .star-rings{padding:2px 18px 20px;gap:10px}
  .star-ring{padding:10px 10px 11px}
}
@media (max-width:420px){
  .topbar h1 span:not(.logo-mark){font-size:15px}
  .topbar h1 small{font-size:9.5px}
  .reportcard{border-radius:10px}
  .rc-head .school{font-size:18px}
  .rc-head h2{font-size:15px}
}
@media (max-width:480px){
  .row .field{width:100%!important;max-width:none!important}
  .row .field input,.row .field select{width:100%!important}
}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',Arial,sans-serif;
  background:radial-gradient(circle at 12% -10%, #ece7fd 0%, transparent 42%),radial-gradient(circle at 100% 0%, #e2f6f3 0%, transparent 38%),var(--paper);padding:20px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 30px;width:100%;max-width:380px;box-shadow:0 10px 32px rgba(36,28,77,.12)}
.auth-card h1{font-family:'Sora',sans-serif;font-size:19px;margin:0 0 4px;color:var(--ink)}
.auth-card p.sub{font-size:12.5px;color:var(--muted);margin:0 0 22px}
.auth-card .field{margin-bottom:14px}
.auth-card .field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
.auth-card input{width:100%;padding:10px 12px;font-size:13.5px}
.auth-card .btn{width:100%;justify-content:center;padding:11px 18px;font-size:13.5px;margin-top:6px}
.auth-toggle{text-align:center;margin-top:16px;font-size:12.5px;color:var(--muted)}
.auth-toggle a{color:var(--primary);font-weight:600;cursor:pointer;text-decoration:none}
.auth-err{background:#fdeef1;color:var(--rose);font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none}
.auth-loading{text-align:center;padding:60px 20px;font-family:'Inter',sans-serif;color:var(--muted)}
.userchip{font-size:11.5px;color:#e6dfff;font-family:'Inter',sans-serif}
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap" style="display:none">
  <div class="auth-card">

// ===== Firestore storage: data chunks me save hota hai (1 MB document limit se bachne ke liye) =====
// Layout: users/{uid}/data/{field}__{n}  (har chunk ~200 KB se chhota) + users/{uid}/data/_meta
// Sirf wahi chunks dobara likhe jate hain jo badle hain. Purana single-document data (users/{uid}.crgData)
// pehli baar load hone par automatically naye format me copy ho jata he, aur purana data backup ki tarah waisa hi rehta he.
const CHUNK_LIMIT = 200000;       // characters per chunk
let chunkMode = false;            // true = data naye format me save ho raha he
let lastSavedChunks = {};         // docId -> signature of what is already stored
let rulesWarned = false;
let saveChain = Promise.resolve();
let savePending = false;

function chunkCol(){ return db.collection('users').doc(currentUser.uid).collection('data'); }

function splitArray(arr){
  const out = []; let cur = [], size = 0;
  arr.forEach(it=>{
    const n = JSON.stringify(it).length + 1;
    if(cur.length && size + n > CHUNK_LIMIT){ out.push(cur); cur = []; size = 0; }
    cur.push(it); size += n;
  });
  if(cur.length) out.push(cur);
  return out;
}
function splitObject(obj){
  const out = []; let cur = {}, size = 0, cnt = 0;
  Object.keys(obj).forEach(k=>{
    const n = k.length + JSON.stringify(obj[k]).length + 4;
    if(cnt && size + n > CHUNK_LIMIT){ out.push(cur); cur = {}; size = 0; cnt = 0; }
    cur[k] = obj[k]; size += n; cnt++;
  });
  if(cnt) out.push(cur);
  return out;
}
// DATA ko chhote chunks me todta he. k: 'a' = array, 'o' = object, 'v' = single value, 'l' = logo text piece
function buildChunks(data){
  const map = {};
  const put = (f, i, k, val)=>{ map[f+'__'+i] = { f, i, k, d: JSON.stringify(val) }; };
  Object.keys(data).forEach(f=>{
    const v = data[f];
    if(f === 'school'){
      const rest = Object.assign({}, v || {}); const logo = String(rest.logo || ''); delete rest.logo;
      put('school', 0, 'v', rest);
      for(let n = 0, p = 0; p < logo.length; p += CHUNK_LIMIT, n++) put('logo', n, 'l', logo.slice(p, p + CHUNK_LIMIT));
    } else if(Array.isArray(v)){
      splitArray(v).forEach((part, n)=> put(f, n, 'a', part));
    } else if(v && typeof v === 'object'){
      splitObject(v).forEach((part, n)=> put(f, n, 'o', part));
    } else if(v !== undefined && v !== null){
      put(f, 0, 'v', v);
    }
  });
  return map;
}
function chunkSig(c){ return c.k + ':' + c.d; }
function rebuildFromChunks(docs){
  const by = {};
  docs.forEach(x=>{ (by[x.f] = by[x.f] || []).push(x); });
  const out = {}; let logo;
  Object.keys(by).forEach(f=>{
    const parts = by[f].sort((a, b)=> a.i - b.i);
    const k = parts[0].k;
    if(f === 'logo') logo = parts.map(p=>JSON.parse(p.d)).join('');
    else if(k === 'a') out[f] = [].concat(...parts.map(p=>JSON.parse(p.d)));
    else if(k === 'o') out[f] = Object.assign({}, ...parts.map(p=>JSON.parse(p.d)));
    else out[f] = JSON.parse(parts[0].d);
  });
  if(out.school || logo !== undefined) out.school = Object.assign({}, out.school || {}, { logo: logo || '' });
  return out;
}
async function persistChunks(){
  const col = chunkCol();
  const next = buildChunks(DATA);
  const ops = [];
  Object.keys(next).forEach(id=>{
    if(lastSavedChunks[id] !== chunkSig(next[id])) ops.push({ t:'set', id, data:{ f:next[id].f, i:next[id].i, k:next[id].k, d:next[id].d } });
  });
  Object.keys(lastSavedChunks).forEach(id=>{ if(!(id in next)) ops.push({ t:'del', id }); });
  if(!ops.length && chunkMode) return;
  // _meta hamesha aakhri batch me jata he, isliye adhoori migration kabhi "complete" nahi maani jati
  ops.push({ t:'set', id:'_meta', data:{ v:2, updatedAt: firebase.firestore.FieldValue.serverTimestamp() } });
  for(let p = 0; p < ops.length; p += 450){
    const batch = db.batch();
    ops.slice(p, p + 450).forEach(o=>{ const r = col.doc(o.id); if(o.t === 'set') batch.set(r, o.data); else batch.delete(r); });
    await batch.commit();
  }
  const sigs = {}; Object.keys(next).forEach(id=>{ sigs[id] = chunkSig(next[id]); });
  lastSavedChunks = sigs; chunkMode = true;
}
function warnRulesOnce(){
  if(rulesWarned) return; rulesWarned = true;
  alert('Data abhi purane tareeke se save ho raha he. Firebase Console me Firestore Rules update karne ke baad ye apne aap naye (bade data wale) format me chala jayega.');
}
async function persistData(){
  if(!currentUser) return;
  try{
    await persistChunks();
  }catch(e){
    console.error(e);
    if(!chunkMode && e.code === 'permission-denied'){
      // Rules abhi update nahi hue: purane tareeke se save karo taaki kuch na khoye
      try{
        await db.collection('users').doc(currentUser.uid).set({ crgData: JSON.stringify(DATA), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        warnRulesOnce();
      }catch(e2){
        console.error(e2);
        alert('Data save karne me error aayi: '+e2.message+'\n\nAgar logo image bahut badi hai to use chota karke try karo.');
      }
      return;
    }
    alert('Data save karne me error aayi: '+e.message);
  }
}
// Kai baar ek saath saveData() call ho to bhi saves ek ke baad ek chalte hain aur latest DATA hi save hota he
function saveData(){
  if(savePending) return saveChain;
  savePending = true;
  saveChain = saveChain.then(async ()=>{ savePending = false; await persistData(); });
  return saveChain;
}
function migrateAttendanceModel(){
  if(DATA.attendanceModel === 2) return false;
  const months = new Set(Object.keys(DATA.dailyAttendance || {}).map(d=>monthNameFromDate(d)));
  months.forEach(m=>{

    // Jin students ki us mahine me attendance li hi nahi gayi, unki purani (0 present wali) bani hui entry hata do
    DATA.students.forEach(st=>{
      const rec = (DATA.attendance[st.id] || {})[m];
      if(rec && rec.total === undefined && Number(rec.present||0) === 0) delete DATA.attendance[st.id][m];
    });
  });
  DATA.attendanceModel = 2;
  return true;
}
async function migrateLegacyToChunks(){
  try{ await persistChunks(); }
  catch(e){ console.warn('Naye format me shift abhi nahi hua:', e); if(e.code === 'permission-denied') warnRulesOnce(); }
}

function subjectAvg(roll, subject, month){
  const rows = DATA.marks.filter(m=>m.roll===roll && m.subject===subject && m.month===month);
  const max = rows.reduce((s,r)=>s+Number(r.max||0),0);
  const obt = rows.reduce((s,r)=>s+Number(r.obtained||0),0);
  return max>0 ? obt/max : 0;
}
function overallAvg(roll, month){
  const rows = DATA.marks.filter(m=>m.roll===roll && m.month===month);
  const max = rows.reduce((s,r)=>s+Number(r.max||0),0);
  const obt = rows.reduce((s,r)=>s+Number(r.obtained||0),0);
  return max>0 ? obt/max : 0;
}

// Performance Trend: student ka Marks%, Attendance% aur Behavior% (5-star scale ko 100 me convert karke)
// har month ke liye nikalta he - jis month me data nahi he wahan null rehta he, taaki chart me sirf actual
// data-wale months connect hon, beech me galat 0% dip na dikhe.
function trendDataFor(roll){
  const marksSeries = [], attSeries = [], behSeries = [];
  MONTHS.forEach(month=>{
    const hasMarks = DATA.marks.some(m=>m.roll===roll && m.month===month && !m.absent);
    marksSeries.push(hasMarks ? Math.round(overallAvg(roll, month)*100) : null);
    const att = attFor(roll, month);
    attSeries.push(att.total>0 ? Math.round(att.pct*100) : null);
    const beh = behAvg(roll, month);
    behSeries.push(beh!==null ? Math.round((beh/5)*100) : null);
  });
  return { months: MONTHS, marksSeries, attSeries, behSeries };
}
function hasAnyTrendData(roll){
  const t = trendDataFor(roll);
  return t.marksSeries.some(v=>v!==null) || t.attSeries.some(v=>v!==null) || t.behSeries.some(v=>v!==null);
}
function workingDaysFor(month){
  return Number((DATA.workingDays && DATA.workingDays[month]) || 0);
}
function setWorkingDays(month, value){
  if(!DATA.workingDays) DATA.workingDays = {};
  DATA.workingDays[month] = Number(value)||0;
  saveData();
  render();
}
// Attendance: daily se bani entry me student ke apne days (total) store hote hain, taaki har class/batch ka
// % uske apne attendance wale dinon par nikle. Monthly tab se manually bhari entry (total nahi) me purana tareeka
// chalta he (month ke Total Working Days). Entry hi nahi he => "data nahi" (total 0), 0% nahi.
function attFor(roll, month){
  const a = (DATA.attendance[roll] || {})[month];
  if(!a) return {present:0, absent:0, total:0, pct:0};
  const present = Number(a.present||0);
  let total, absent;
  if(a.total !== undefined){
    total = Number(a.total) || 0;
    absent = Math.max(total - present, 0);
  } else {
    const workingDays = workingDaysFor(month);
    if(workingDays>0){ total = workingDays; absent = Math.max(total - present, 0); }
    else { absent = Number(a.absent||0); total = present + absent; }
  }
  return {present, absent, total, pct: total>0 ? present/total : 0};
}

// Behavior Rating: har month me student ke liye multiple teachers apni rating (1-5) daal sakte hain.
// Sabki ratings ek list me store hoti hain, aur unka average final Behavior Score banta he.
function behEntriesFor(roll, month){
  if(!DATA.behavior[roll]) DATA.behavior[roll] = {};
  if(!DATA.behavior[roll][month]) DATA.behavior[roll][month] = [];
  return DATA.behavior[roll][month];
}
function behAvg(roll, month){
  const entries = (DATA.behavior[roll] && DATA.behavior[roll][month]) || [];
  if(entries.length===0) return null;
  const sum = entries.reduce((s,e)=>s+Number(e.rating||0),0);
  return sum/entries.length;
}
function addBehaviorRating(roll, month, ratingVal){
  const rating = Number(ratingVal);
  if(!rating || rating<1 || rating>5){ alert('Rating 1 se 5 ke beech honi chahiye.'); return; }
  const entries = behEntriesFor(roll, month);
  entries.push({ id: Date.now()+Math.floor(Math.random()*1000), rating });
  saveData();
  render();
}
function updateBehaviorRating(roll, month, entryId, ratingVal){
  const rating = Number(ratingVal);
  if(!rating || rating<1 || rating>5){ alert('Rating 1 se 5 ke beech honi chahiye.'); render(); return; }
  const entries = behEntriesFor(roll, month);
  const entry = entries.find(e=>e.id===entryId);
  if(entry){ entry.rating = rating; saveData(); }
  render();
}
function deleteBehaviorRating(roll, month, entryId){
  const entries = behEntriesFor(roll, month);
  const idx = entries.findIndex(e=>e.id===entryId);
  if(idx>-1){ entries.splice(idx,1); saveData(); render(); }
}
// Clickable 1-5 star picker. onClickJs is the JS call string invoked with the clicked star number appended,
// e.g. "addBehaviorRating(5, 'January',". filledUpto controls how many stars show as gold by default.
function starPickerHtml(onClickJs, filledUpto){
  let html = '<span class="star-picker">';
  for(let i=1;i<=5;i++){
    html += `<span class="star-pick ${i<=filledUpto?'filled':''}" onclick="${onClickJs}${i})">${i<=filledUpto?'★':'☆'}</span>`;
  }
  html += '</span>';
  return html;
}
// Read-only star display for averages (rounds to nearest whole star), with the precise number alongside.
function starsDisplayHtml(value){
  if(value===null || value===undefined) return '<span class="pct">-</span>';
  const rounded = Math.round(value);
  let stars = '';
  for(let i=1;i<=5;i++){ stars += i<=rounded ? '★' : '☆'; }
  return `<span class="star-readonly">${stars}</span> <span class="pct">(${value.toFixed(1)}/5)</span>`;
}

let dashMonth = '';

function setDashMonth(m){ dashMonth = m; render(); }
function dashGroupSort(a, b){
  const idx = v => { const i = STANDARD_LIST.indexOf(v); return i<0 ? 999 : i; };
  return idx(a.standard)-idx(b.standard) || String(a.standard).localeCompare(String(b.standard)) || String(a.stream).localeCompare(String(b.stream));
}
const dashAvg = arr => arr.length ? arr.reduce((x,y)=>x+y,0)/arr.length : null;
// Kisi ek month ke liye poori class ke numbers nikalta he (DATA ko badalta nahi)
function computeDashboard(month){
  const set = dashSettings();
  const mk = {};
  DATA.marks.forEach(m=>{
    if(m.month !== month) return;
    const o = mk[m.roll] || (mk[m.roll] = { max:0, obt:0, real:false, subs:new Set() });
    o.max += Number(m.max||0); o.obt += Number(m.obtained||0);
    if(!m.absent) o.real = true;
    o.subs.add(m.subject);
  });
  const rows = DATA.students.map(s=>{
    const m = mk[s.id];
    const hasMarks = !!(m && m.real && m.max > 0);
    const att = attFor(s.id, month);   // record hi nahi he => total 0 => attendance data nahi (0% mat dikhao)
    return {
      id:s.id, roll:s.roll, name:s.name, standard:s.standard || '', stream:s.stream || '',
      group:(s.standard || 'No standard') + (s.stream ? ' - ' + s.stream : ''),
      hasMarks, pct: hasMarks ? m.obt / m.max * 100 : null,
      attPct: att.total > 0 ? att.pct * 100 : null,
      subs: m ? m.subs : new Set()
    };
  });
  const withMarks = rows.filter(r=>r.hasMarks);
  const pass = withMarks.filter(r=>r.pct >= set.passMark).length;
  const attRows = rows.filter(r=>r.attPct !== null);

  let today = { state:'none' };
  const t = DATA.dailyAttendance && DATA.dailyAttendance[todayISO()];
  if(t){
    const vals = Object.values(t.marks || {});
    const pr = vals.filter(v=>v==='P').length, ab = vals.filter(v=>v==='A').length;
    if(pr + ab > 0) today = { state:'taken', present:pr, total:pr+ab, pct: pr / (pr+ab) * 100 };
    else if(vals.includes('H') || t.status === 'holiday') today = { state:'holiday' };
  }

  const byGroup = {};
  rows.forEach(r=>{ (byGroup[r.group] = byGroup[r.group] || []).push(r); });
  const groups = Object.keys(byGroup).map(g=>{
    const list = byGroup[g], first = list[0];
    const gm = list.filter(r=>r.hasMarks), ga = list.filter(r=>r.attPct !== null);
    const expected = new Set(); list.forEach(r=>r.subs.forEach(x=>expected.add(x)));
    const pending = [...expected].map(sub=>({ subject:sub, count:list.filter(r=>!r.subs.has(sub)).length })).filter(x=>x.count > 0);
    return {
      name:g, standard:first.standard, stream:first.stream, count:list.length,
      avg: dashAvg(gm.map(r=>r.pct)), att: dashAvg(ga.map(r=>r.attPct)),
      pass: gm.filter(r=>r.pct >= set.passMark).length, fail: gm.filter(r=>r.pct < set.passMark).length,
      pending, noMarks: expected.size === 0
    };
  }).sort(dashGroupSort);

  const pendingStudents = groups.reduce((n, g)=>{
    if(g.noMarks) return n;
    return n + byGroup[g.name].filter(r=>{
      const exp = new Set(); byGroup[g.name].forEach(x=>x.subs.forEach(y=>exp.add(y)));
      return [...exp].some(sub=>!r.subs.has(sub));
    }).length;
  }, 0);

  return {
    set, total: rows.length, today, withMarks: withMarks.length,
    classAvg: dashAvg(withMarks.map(r=>r.pct)), monthAtt: dashAvg(attRows.map(r=>r.attPct)), attCount: attRows.length,
    pass, fail: withMarks.length - pass, pendingStudents, groups,
    lowAtt: attRows.filter(r=>r.attPct < set.attAlert).sort((a,b)=>a.attPct-b.attPct),
    failing: withMarks.filter(r=>r.pct < set.passMark).sort((a,b)=>a.pct-b.pct),
    top: withMarks.slice().sort((a,b)=>b.pct-a.pct || (b.attPct||0)-(a.attPct||0)).slice(0,5)
  };
}
function dashCard(label, value, sub, cls){
  return `<div class="dash-card ${cls||''}"><div class="dc-label">${label}</div><div class="dc-value">${value}</div><div class="dc-sub">${sub||'&nbsp;'}</div></div>`;
}
function dashPctText(v){ return v === null || v === undefined ? '—' : Math.round(v) + '%'; }
function dashStudentTable(list, valueLabel, valueFn){
  if(!list.length) return '<div class="pct">Koi nahi — sab theek he.</div>';

  return `<div style="overflow-x:auto"><table><tr><th>Student</th><th>Standard</th><th>${valueLabel}</th></tr>

    return `<tr><td><b>${dashEsc(g.name)}</b></td><td>${g.pending.map(x=>`${dashEsc(x.subject)}: <b>${x.count}</b> students baaki`).join(' &nbsp;•&nbsp; ')}</td></tr>`;
  }).join('');

  return `

      <div class="field"><label>Attendance alert (% se kam)</label><input id="dash-att" type="number" min="1" max="100" value="${set.attAlert}" style="width:110px"></div>

    <h3 style="margin:20px 0 8px">Fail ho rahe students — ${set.passMark}% se kam (${d.failing.length})</h3>

// ===== Backup & Restore =====
const BACKUP_APP_ID = 'ClassReportGenerator';
function backupStamp(){
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());
}
function backupCounts(d){
  return { students:(d.students||[]).length, marks:(d.marks||[]).length, subjects:(d.subjects||[]).length };
}
function getLastBackupTime(){
  try{ const t = localStorage.getItem('crgLastBackup'); return t ? new Date(t).toLocaleString('en-IN') : ''; }catch(e){ return ''; }
}
function backupRestoreView(){
  const c = backupCounts(DATA);
  const last = getLastBackupTime();
  return `
  <div class="card" style="max-width:640px">
    <h2>Backup &amp; Restore</h2>
    <div class="pct" style="margin-bottom:14px">Abhi ka data: <b>${c.students}</b> students, <b>${c.marks}</b> marks entries, <b>${c.subjects}</b> subjects.<br>Last backup (is browser se): <b>${last || 'abhi tak nahi liya'}</b></div>

    <h3 style="margin:14px 0 6px">1. Backup lo</h3>
    <div class="pct" style="margin-bottom:8px">Poora data (students, marks, attendance, remarks, behavior, school details aur logo) ek hi file me download hoga.</div>
    <button class="btn" onclick="downloadBackup('ClassReport_Backup')">Download Backup</button>

    <h3 style="margin:22px 0 6px">2. Backup se Restore karo</h3>
    <div class="pct" style="margin-bottom:8px">Wahi backup file chuno jo upar se download hui thi. <b>Restore karne par abhi ka poora data us file ke data se replace ho jayega.</b> Restore se pehle abhi ke data ka ek automatic backup bhi download hoga.</div>
    <button class="btn secondary" onclick="document.getElementById('restore-file').click()">Restore from Backup</button>
    <input type="file" id="restore-file" accept=".json,application/json" style="display:none" onchange="restoreFromBackup(this)">
  </div>`;
}
function downloadBackup(prefix){
  const payload = {
    app: BACKUP_APP_ID,
    backupVersion: 1,
    exportedAt: new Date().toISOString(),
    schoolName: (DATA.school && DATA.school.name) || '',
    counts: backupCounts(DATA),
    data: DATA
  };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (prefix || 'ClassReport_Backup')+'_'+backupStamp()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  if(prefix === 'ClassReport_Backup'){
    try{ localStorage.setItem('crgLastBackup', new Date().toISOString()); }catch(e){}
    if(tab === 'admin') render();
  }
}
// Backup file ka data validate karke poora aur sahi shape wala DATA banata he
function normalizeBackupData(d){
  const arrays = ['students','marks','subjects','testOrder'];
  const objects = ['attendance','workingDays','dailyAttendance','remarks','behavior'];
  const out = Object.assign({}, d);
  arrays.forEach(k=>{ if(!Array.isArray(out[k])) out[k] = []; });
  objects.forEach(k=>{ if(!out[k] || typeof out[k] !== 'object' || Array.isArray(out[k])) out[k] = {}; });
  out.school = Object.assign({ name:'', address:'', mobile:'', logo:'' }, (d.school && typeof d.school === 'object') ? d.school : {});
  if(out.school.logo === undefined || out.school.logo === null) out.school.logo = '';
  return out;
}
function parseBackupFile(text){
  let obj;
  try{ obj = JSON.parse(text); }catch(e){ throw new Error('File padhi nahi ja rahi. Sahi backup file (.json) chuno.'); }
  if(!obj || obj.app !== BACKUP_APP_ID || !obj.data || !Array.isArray(obj.data.students)) throw new Error('Ye is app ki backup file nahi lag rahi. "Download Backup" se bani file hi chuno.');
  return obj;
}
function restoreFromBackup(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    try{
      const obj = parseBackupFile(e.target.result);
      const bc = backupCounts(obj.data), cc = backupCounts(DATA);
      const when = obj.exportedAt ? new Date(obj.exportedAt).toLocaleString('en-IN') : 'pata nahi';
      const msg = 'Backup file ('+when+'):\n  '+bc.students+' students, '+bc.marks+' marks entries, '+bc.subjects+' subjects\n\n'
                + 'Abhi ka data:\n  '+cc.students+' students, '+cc.marks+' marks entries, '+cc.subjects+' subjects\n\n'
                + 'Restore karne par abhi ka poora data replace ho jayega (pehle abhi ke data ka automatic backup download hoga).\n\nRestore kare?';
      if(!confirm(msg)) return;
      downloadBackup('ClassReport_BeforeRestore');
      DATA = normalizeBackupData(obj.data);
      selectedRoll = DATA.students.length ? DATA.students[0].id : null;
      await saveData();
      render();
      alert('Restore ho gaya: '+DATA.students.length+' students aur '+DATA.marks.length+' marks entries.');
    }catch(err){
      alert(err.message);
    }finally{
      input.value = '';
    }
  };
  reader.readAsText(file);
}

const STUDENT_STREAMS = ['Commerce','Science','Arts','Other'];
function normStandard(v){
  let t = String(v==null?'':v).trim().toLowerCase().replace(/[\s.\-_]/g,'');
  if(!t) return '';
  const alias = {jrkg:'Jr KG', jkg:'Jr KG', lkg:'Jr KG', srkg:'Sr KG', skg:'Sr KG', ukg:'Sr KG'};
  if(alias[t]) return alias[t];
  const m = t.match(/^(?:std|standard|class)?(\d{1,2})(?:st|nd|rd|th)?$/);
  if(m){
    const std = ({1:'1st',2:'2nd',3:'3rd'})[Number(m[1])] || (m[1]*1)+'th';
    return STANDARD_LIST.includes(std) ? std : '';
  }
  return '';
}
function normStream(v){
  const t = String(v==null?'':v).trim().toLowerCase();
  return STUDENT_STREAMS.find(x=>x.toLowerCase()===t) || '';
}
function normMobile(v){
  if(v==null) return '';
  if(typeof v==='number') return String(Math.round(v));
  return String(v).trim().replace(/\.0+$/,'');
}
function parseStudentRows(rows){
  const key = h => String(h).toLowerCase().replace(/[^a-z0-9]/g,'');
  const map = {roll:['roll','rollno','rollnumber'], name:['name','studentname'], standard:['standard','std','class'], stream:['stream'], mobile:['number','mobile','mobileno','mobilenumber','phone','contact']};
  const out = {valid:[], skipped:[], errors:[]};
  const seen = new Set(DATA.students.map(x=>x.roll+'|'+(x.standard||'')+'|'+(x.stream||'')));
  rows.forEach((r,i)=>{
    const cols = {};
    Object.keys(r).forEach(h=>{ for(const f in map){ if(map[f].includes(key(h))) cols[f] = r[h]; } });
    const rowNo = i+2;
    const isEmpty = !Object.values(cols).some(v=>String(v==null?'':v).trim()!=='');
    if(isEmpty) return;
    const roll = Number(String(cols.roll==null?'':cols.roll).trim());
    const name = String(cols.name==null?'':cols.name).trim();
    const rawStd = String(cols.standard==null?'':cols.standard).trim();
    const standard = normStandard(cols.standard);
    if(!roll || roll<1 || !Number.isInteger(roll)){ out.errors.push('Row '+rowNo+': Roll no galat ya khali'); return; }
    if(!name){ out.errors.push('Row '+rowNo+': Name khali hai'); return; }
    if(rawStd && !standard){ out.errors.push('Row '+rowNo+': Standard "'+rawStd+'" samajh nahi aaya'); return; }
    let stream = '';
    if(hasStream(standard)){
      const rawStream = String(cols.stream==null?'':cols.stream).trim();
      stream = normStream(rawStream);
      if(rawStream && !stream){ out.errors.push('Row '+rowNo+': Stream "'+rawStream+'" galat hai (Commerce / Science / Arts / Other)'); return; }
    }
    const k = roll+'|'+standard+'|'+stream;
    if(seen.has(k)){ out.skipped.push('Row '+rowNo+': '+name+' (roll '+roll+') pehle se hai'); return; }
    seen.add(k);
    out.valid.push({roll, name, standard, stream, mobile: normMobile(cols.mobile)});
  });
  return out;
}
function downloadStudentTemplate(){
  if(typeof XLSX==='undefined'){ alert('Excel library load nahi hui. Internet check karke page refresh karo.'); return; }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([['Roll no','Name','Standard','Stream','Number']]);
  ws['!cols'] = [{wch:10},{wch:28},{wch:12},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws, 'Students');
  const info = [
    ['Import ke rules'],
    [''],
    ['Roll no','Number (zaroori)'],
    ['Name','Student ka naam (zaroori)'],
    ['Standard','Jr KG, Sr KG, 1st, 2nd, 3rd ... 12th (1, 2, 8th jaise bhi chalega)'],
    ['Stream','Sirf 11th aur 12th ke liye: Commerce / Science / Arts / Other. Baaki standard me khali chhodo'],
    ['Number','Mobile number (optional)'],
    [''],
    ['Example'],
    ['Roll no','Name','Standard','Stream','Number'],
    [1,'Rahul Shah','Jr KG','','9876543210'],
    [2,'Priya Patel','8th','','9123456780'],
    [3,'Amit Mehta','12th','Commerce','9988776655'],
    [''],
    ['Note: "Students" sheet me sirf data bharo. Ye "Instructions" sheet import nahi hoti.']
  ];
  const wi = XLSX.utils.aoa_to_sheet(info);
  wi['!cols'] = [{wch:12},{wch:80},{wch:12},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wi, 'Instructions');
  XLSX.writeFile(wb, 'Student_Import_Format.xlsx');
}
function importStudentsFromExcel(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(typeof XLSX==='undefined'){ alert('Excel library load nahi hui. Internet check karke page refresh karo.'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheetName = wb.SheetNames.find(n=>n.toLowerCase()==='students') || wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:''});
      const res = parseStudentRows(rows);
      let msg = res.valid.length+' students import honge.';
      if(res.skipped.length) msg += '\n\n'+res.skipped.length+' skip (pehle se maujood):\n'+res.skipped.slice(0,10).join('\n')+(res.skipped.length>10?'\n...':'');
      if(res.errors.length) msg += '\n\n'+res.errors.length+' rows me galti (ye import nahi hongi):\n'+res.errors.slice(0,10).join('\n')+(res.errors.length>10?'\n...':'');
      if(!res.valid.length){ alert(msg+'\n\nKoi naya student import karne layak nahi mila.'); return; }
      if(!confirm(msg+'\n\nImport kare?')) return;
      res.valid.forEach(st=>{ DATA.students.push({id: nextStudentId(), ...st}); });
      saveData(); render();
    }catch(err){
      alert('File padh nahi paye: '+err.message);
    }finally{
      input.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}

function nextStudentId(){
  let max = 0;
  DATA.students.forEach(s=>{ if(s.id>max) max = s.id; });
  return max+1;
}
function addStudent(){
  const roll = Number(document.getElementById('s-roll').value);

  const standard = document.getElementById('s-standard').value;

  const mobile = document.getElementById('s-mobile').value.trim();
  if(!roll || !name){ alert('Roll no aur naam dono bharo'); return; }

  DATA.students.push({id, roll, name, standard, stream, mobile});

function removeStudent(id){
  DATA.students = DATA.students.filter(s=>s.id!==id);

  delete DATA.attendance[id];

function saveBulkMarks() {
  const examDate = document.getElementById('bm-examdate').value;
  const subject = document.getElementById('bm-subject').value;
  const chapter = document.getElementById('bm-chapter').value.trim();
  const topic = document.getElementById('bm-topic').value.trim();
  const max = Number(document.getElementById('bm-max').value);

  if(!subject || !max || !examDate) { alert('Exam Date, Subject aur Max marks sabhi fill karna zaroori hai.'); return; }

  const month = monthNameFromDate(examDate);
  currentMonth = month;
  const pendingTestNames = {};

  let addedCount = 0;

  const filteredStudents = DATA.students.filter(s=>
    (!bulkMarksFilterStandard || s.standard===bulkMarksFilterStandard) &&
    (!bulkMarksFilterStream || s.stream===bulkMarksFilterStream));

  filteredStudents.forEach(s => {
    const inputField = document.getElementById('bm-obt-' + s.id);
    const absentField = document.getElementById('bm-abs-' + s.id);
    const isAbsent = absentField && absentField.checked;
    if(isAbsent || (inputField && inputField.value !== '')) {
      const obtained = isAbsent ? 0 : Number(inputField.value);
      
      // Test ka naam auto banta he (same class + subject + date ke liye ek hi naam)
      const test = autoTestName(s, subject, examDate, pendingTestNames);
      recordTestOrder(test);
      // Remove older record for the exact same subject + test + month for this student 
      DATA.marks = DATA.marks.filter(m => !(m.roll === s.id && m.subject === subject && m.test === test && m.month === month));
      
      DATA.marks.push({ roll: s.id, month, examDate, subject, test, chapter, topic, max, obtained, absent: !!isAbsent });
      addedCount++;
    }
  });

  if (addedCount > 0) {
    saveData();
    alert(`${addedCount} students ke marks ${formatExamDate(examDate)} (${month}) ke liye successfully save ho gaye!`);
    DATA.students.forEach(s => {
      const inputField = document.getElementById('bm-obt-' + s.id);
      const absentField = document.getElementById('bm-abs-' + s.id);
      if(inputField) inputField.value = '';
      if(absentField) absentField.checked = false;
      if(inputField) inputField.disabled = false;
    });
  } else {
    alert('Koi marks enter nahi kiye gaye the.');
  }
}

function saveMark(){

  const subject = document.getElementById('m-subject').value;
  const chapter = document.getElementById('m-chapter').value.trim();

  if(!examDate){ alert('Exam date select karo'); return; }

  const month = monthNameFromDate(examDate);
  currentMonth = month;
  const student = DATA.students.find(x=>x.id === roll);

  const oldMark = editingMarkIndex !== null ? DATA.marks[editingMarkIndex] : null;

function todayISO(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
const CALENDAR_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthNameFromDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return CALENDAR_MONTHS[d.getMonth()];
}
function formatExamDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  const pad = n=>String(n).padStart(2,'0');
  return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`;
}
function examDateDisplay(m){
  return m.examDate ? formatExamDate(m.examDate) : (m.month || '—');
}
// ===== Auto unit test name: Sr.No./std/sub short name/date(ddmmyy) =====
// Example: 3/8th/MAT/211026. Pehle se saved data ke test naam kabhi nahi badalte.
const AUTO_TEST_RE = /^(\d+)\/([^\/]+)\/([^\/]+)\/(\d{6})$/;
function subjectShortName(subject){
  const words = String(subject||'').trim().split(/[\s&\-_.,\/]+/).filter(Boolean);
  if(!words.length) return 'SUB';
  if(words.length === 1) return Array.from(words[0]).slice(0,3).join('').toUpperCase();
  return words.map(w=>Array.from(w)[0]).join('').slice(0,4).toUpperCase();
}
function examDateCode(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
  return m ? m[3] + m[2] + m[1].slice(2) : '';
}
function autoTestParts(student, subject, examDate){
  return { std:(student && student.standard) || 'NA', stream:(student && student.stream) || '', short:subjectShortName(subject), dc:examDateCode(examDate) };
}
function nextTestSerial(pending){
  let max = 0;
  DATA.marks.forEach(m=>{ const r = AUTO_TEST_RE.exec(m.test||''); if(r) max = Math.max(max, Number(r[1])); });
  Object.keys(pending||{}).forEach(k=>{ const r = AUTO_TEST_RE.exec(pending[k]); if(r) max = Math.max(max, Number(r[1])); });
  return max + 1;
}
// Same class (std + stream) + subject + date ka test already bana he to wahi naam, warna naya Sr.No.
function autoTestName(student, subject, examDate, pending){
  const p = autoTestParts(student, subject, examDate);
  const key = [p.std, p.stream, subject, p.dc].join('|');
  if(pending && pending[key]) return pending[key];
  const hit = DATA.marks.find(m=>{
    const r = AUTO_TEST_RE.exec(m.test||'');
    if(!r || r[2] !== p.std || r[3] !== p.short || r[4] !== p.dc || m.subject !== subject) return false;
    const ms = DATA.students.find(x=>x.id === m.roll);
    return ((ms && ms.stream) || '') === p.stream;
  });
  const name = hit ? hit.test : nextTestSerial(pending) + '/' + p.std + '/' + p.short + '/' + p.dc;
  if(pending) pending[key] = name;
  return name;
}
function autoTestPreview(student, subject, date){
  return (student && subject && date) ? autoTestName(student, subject, date) : '';
}
function refreshAutoTestName(){
  const el = document.getElementById('m-test'); if(!el) return;
  const old = editingMarkIndex !== null ? DATA.marks[editingMarkIndex] : null;
  if(old && !AUTO_TEST_RE.test(old.test || '')) return;   // purani entry ka naam as-is
  const st = DATA.students.find(x=>x.id === Number(document.getElementById('m-roll').value));
  el.value = autoTestPreview(st, document.getElementById('m-subject').value, document.getElementById('m-examdate').value);
}
function bulkTestPreviewText(subject, date){
  if(!subject || !date) return '';
  const pending = {}, names = [];
  DATA.students.filter(x=>(!bulkMarksFilterStandard || x.standard === bulkMarksFilterStandard) && (!bulkMarksFilterStream || x.stream === bulkMarksFilterStream))
    .forEach(x=>{ const n = autoTestName(x, subject, date, pending); if(!names.includes(n)) names.push(n); });
  if(names.length === 1) return names[0];
  return names.length ? 'Har class ka alag naam (' + names.length + ' tests)' : '';
}
function refreshBulkAutoTestName(){
  const el = document.getElementById('bm-test'); if(!el) return;
  el.value = bulkTestPreviewText(document.getElementById('bm-subject').value, document.getElementById('bm-examdate').value);
}
// Daily attendance: marks[studentId] = 'P' (present) | 'A' (absent) | 'H' (us class ki holiday).
// Har student ke total days = jitne din uski attendance li gayi (P ya A). Holiday ('H') ya jis din uski class ki
// attendance nahi li gayi, wo din uske days me nahi ginta. Isse alag-alag batch/class ka % galat nahi hota.
function recalcMonthlyAttendance(month){
  if(!DATA.dailyAttendance) DATA.dailyAttendance = {};
  if(!DATA.attendance) DATA.attendance = {};
  const dates = Object.keys(DATA.dailyAttendance).filter(d=>
    DATA.dailyAttendance[d].status !== 'holiday' && monthNameFromDate(d)===month);
  DATA.students.forEach(s=>{
    let present = 0, absent = 0;
    dates.forEach(d=>{
      const v = (DATA.dailyAttendance[d].marks || {})[s.id];
      if(v==='P') present++; else if(v==='A') absent++;
    });
    if(present + absent > 0){
      if(!DATA.attendance[s.id]) DATA.attendance[s.id] = {};
      DATA.attendance[s.id][month] = { present, absent, total: present + absent };
    }
  });
}
// Ek date par selected class ke students ka day type: 'working' | 'holiday' | null (abhi record nahi)
function classDayType(date, students){
  const rec = DATA.dailyAttendance && DATA.dailyAttendance[date];
  if(!rec) return null;
  const marks = rec.marks || {};
  const vals = students.map(s=>marks[s.id]).filter(Boolean);
  if(vals.includes('H')) return 'holiday';
  if(vals.length) return 'working';
  return rec.status==='holiday' ? 'holiday' : null;   // purana (pure din ka) holiday record
}

function takeAttKey(){ return takeAttDate + '|' + takeAttStandard + '|' + takeAttStream; }
function setTakeAttStatus(v){ takeAttStatus = v; takeAttStatusKey = takeAttKey(); render(); }

  return `

          <option value="working" ${status==='working'?'selected':''}>Working Day</option>
          <option value="holiday" ${status==='holiday'?'selected':''}>Holiday</option>
        </select>
      </div>
    </div>
    ${status==='holiday' ? '<div class="empty">Holiday select hai -- ye sirf upar chuni hui standard/stream ke liye lagegi. Baaki classes ki attendance par koi asar nahi padega.</div>' :
      DATA.students.length===0 ? '<div class="empty">Pehle Student Details &gt; Add New Student se student add karo.</div>' :
      filteredStudents.length===0 ? '<div class="empty">Is standard/stream me koi student nahi mila.</div>' :
      `<div class="pct" style="margin-bottom:10px">Default sab present maane jaayenge -- sirf absent students tick karo. Sirf upar chuni hui class ki attendance save hogi.</div>
       <div class="table-wrap"><table><tr><th>Roll</th><th>Name</th><th>Absent</th></tr>${rows}</table></div>`}
    <div style="margin-top:20px"><button class="btn" onclick="saveTakeAttendance()">Save Attendance</button></div>
  </div>`;
}
function saveTakeAttendance(){
  const dateVal = document.getElementById('ta-date').value;
  const statusVal = document.getElementById('ta-status').value;
  if(!dateVal){ alert('Date select karo'); return; }
  if(!DATA.dailyAttendance) DATA.dailyAttendance = {};
  const filteredStudents = DATA.students.filter(s=>
    (!takeAttStandard || s.standard===takeAttStandard) &&
    (!takeAttStream || s.stream===takeAttStream));
  if(filteredStudents.length===0){ alert('Is standard/stream me koi student nahi mila'); return; }

  // Sirf selected class ke students ki entry badalti he; baaki classes ka record jaisa tha waisa rehta he
  const rec = DATA.dailyAttendance[dateVal];
  const marks = (rec && rec.status!=='holiday' && rec.marks) ? {...rec.marks} : {};
  filteredStudents.forEach(s=>{

    }
  });
  DATA.dailyAttendance[dateVal] = { status:'working', marks };
  takeAttStatusKey = '';

  recalcMonthlyAttendance(monthNameFromDate(dateVal));
  saveData();
  alert('Attendance ' + dateVal + ' ke liye save ho gayi!');
  render();
}

// Star of the Month: har student ka combined score (70% marks + 15% attendance + 15% behavior) nikalta he
// us month ke liye, aur sabse zyada score wale student ko "Star" chunta he. Behavior score multiple teachers
// ki 1-5 ratings ka average hota he, jise 0-1 scale par convert karke jodte hain. Students jinka us month me
// koi data (marks/attendance/behavior) nahi he, unko skip karta he.
function computeStarOfMonth(month, standardFilter, streamFilter){
  let best = null;
  const students = DATA.students.filter(s=>
    (!standardFilter || s.standard===standardFilter) &&
    (!streamFilter || s.stream===streamFilter));
  students.forEach(s=>{
    const hasMarks = DATA.marks.some(m=>m.roll===s.id && m.month===month && !m.absent);
    const att = attFor(s.id, month);
    const hasAtt = att.total > 0;
    const beh = behAvg(s.id, month);
    const hasBehavior = beh !== null;
    if(!hasMarks && !hasAtt && !hasBehavior) return;
    const overall = overallAvg(s.id, month);
    const attPct = hasAtt ? att.pct : 0;
    const behPct = hasBehavior ? (beh-1)/4 : 0;
    const score = (overall * 0.7) + (attPct * 0.15) + (behPct * 0.15);
    if(!best || score > best.score){
      best = { roll: s.id, name: s.name, score, overall, attPct, att, beh, hasMarks };
    }
  });
  return best;
}

function drawReportCharts(roll, suffix, month){
  const att = attFor(roll, month);
  const subs = subjectsFor(roll, month);
  const pieId = 'pie-'+roll+suffix, barId = 'bar-'+roll+suffix;
  
  if(charts[pieId]) charts[pieId].destroy();
  if(charts[barId]) charts[barId].destroy();
  
  const chartPalette = ['#4f3cc9','#0ea5a5','#f5a524','#e2436b','#7d6cf0','#1a9c6b','#eab308','#06b6d4'];

  const pieSliceLabelPlugin = {
    id:'pieSliceLabel-'+pieId,
    afterDatasetsDraw(chart){
      const {ctx} = chart;
      chart.getDatasetMeta(0).data.forEach((slice,i)=>{
        const val = chart.data.datasets[0].data[i];
        if(!val) return;
        const pos = slice.tooltipPosition();
        ctx.save();
        ctx.font = '700 13px Inter, sans-serif';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(val, pos.x, pos.y);
        ctx.restore();
      });
    }
  };
  const pieEl = document.getElementById(pieId);
  if(pieEl) charts[pieId] = new Chart(pieEl, {
    type:'doughnut',
    data:{labels:['Present','Absent'], datasets:[{data:[att.present,att.absent], backgroundColor:['#0ea5a5','#e2436b'], borderColor:'#fff', borderWidth:3, hoverOffset:6}]},
    options:{responsive:true, maintainAspectRatio:false, animation:false, cutout:'62%',
      plugins:{legend:{display:true, position:'bottom', labels:{font:{size:11, family:'Inter'}, color:'#716c94', usePointStyle:true, pointStyle:'circle', padding:14,
        generateLabels(chart){
          const data = chart.data;
          return data.labels.map((label,i)=>({
            text: label+': '+data.datasets[0].data[i],
            fillStyle: data.datasets[0].backgroundColor[i],
            strokeStyle: data.datasets[0].backgroundColor[i],
            pointStyle:'circle',
            index:i
          }));
        }
      }}}},
    plugins:[pieSliceLabelPlugin]
  });
  
  const barEl = document.getElementById(barId);
  const barValues = subs.map(s=>Math.round(subjectAvg(roll,s,month)*100));
  const barColors = subs.map((_,i)=>chartPalette[i % chartPalette.length]);
  const valueLabelPlugin = {
    id:'valueLabel-'+barId,
    afterDatasetsDraw(chart){
      const {ctx, chartArea} = chart;
      chart.getDatasetMeta(0).data.forEach((bar,i)=>{
        ctx.save();
        ctx.fillStyle = '#241c4d';
        ctx.font = '700 11px Inter, Arial';
        ctx.textAlign = 'center';
        const y = Math.max(bar.y - 6, chartArea.top + 10);
        ctx.fillText(barValues[i]+'%', bar.x, y);
        ctx.restore();
      });
    }
  };
  
  if(barEl) charts[barId] = new Chart(barEl, {
    type:'bar',
    data:{labels:subs.length ? subs : ['No Data'], datasets:[{label:'%', data:subs.length ? barValues : [0], backgroundColor:subs.length ? barColors : '#e7e4f7', borderRadius:6, maxBarThickness:44}]},
    options:{responsive:true, maintainAspectRatio:false, animation:false,
      layout:{padding:{top:18}},
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true, min:0, max:100, ticks:{stepSize:20, callback:v=>v+'%', font:{family:'Inter',size:10.5}, color:'#716c94'}, grid:{color:'#ece9fa'}},
               x:{ticks:{font:{family:'Inter',size:10.5}, color:'#716c94'}, grid:{display:false}}}},

  });

function subjectAvgAllMonths(roll, subject){

  const max = rows.reduce((s,r)=>s+Number(r.max||0),0);
  const obt = rows.reduce((s,r)=>s+Number(r.obtained||0),0);
  return max>0 ? obt/max : 0;
}

function overallAvgAllMonths(roll){
  const rows = DATA.marks.filter(m=>m.roll===roll);
  const max = rows.reduce((s,r)=>s+Number(r.max||0),0);
  const obt = rows.reduce((s,r)=>s+Number(r.obtained||0),0);
  return max>0 ? obt/max : null;
}
function profileMonthWiseView(roll){
  const t = trendDataFor(roll);
  const hasData = t.marksSeries.some(v=>v!==null);
  return `
  <div class="card">

}
function profileSubjectWiseView(roll){
  const subs = subjectsForRoll(roll);
  return `
  <div class="card">
    <h2>Subject Wise Performance</h2>
    ${subs.length ? `<div class="chartbox" style="height:320px"><canvas id="profile-subject-bar-${roll}" role="img" aria-label="Subject wise marks performance"></canvas></div>`
      : '<div class="empty">Is student ke liye abhi tak koi marks entry nahi hai.</div>'}
  </div>`;
}
function testsForRoll(roll){
  const tests = [...new Set(DATA.marks.filter(m=>m.roll===roll).map(m=>m.test).filter(Boolean))];
  return tests.sort((a,b)=>a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
}
function profileUnitTestWiseView(roll){
  const tests = testsForRoll(roll);
  if(!tests.length){
    return `<div class="card"><h2>Unit Test Wise Performance</h2><div class="empty">Is student ke liye abhi tak koi unit test ka marks entry nahi hai.</div></div>`;
  }
  let sr = 0;
  const rows = tests.map(test=>{
    const marks = DATA.marks.filter(m=>m.roll===roll && m.test===test);
    return marks.map(r=>{
      sr++;
      const pct = (!r.absent && r.max>0) ? Math.round(r.obtained/r.max*100) : null;

function drawProfileMonthChart(roll){
  const id = 'profile-month-bar-'+roll;
  if(charts[id]) charts[id].destroy();
  const el = document.getElementById(id);
  if(!el) return;
  const t = trendDataFor(roll);
  const chartPalette = ['#4f3cc9','#0ea5a5','#f5a524','#e2436b','#7d6cf0','#1a9c6b','#eab308','#06b6d4','#c026d3','#65a30d','#0284c7','#dc2626'];
  const barValues = t.marksSeries;
  const valueLabelPlugin = {
    id:'valueLabel-'+id,
    afterDatasetsDraw(chart){
      const {ctx, chartArea} = chart;
      chart.getDatasetMeta(0).data.forEach((bar,i)=>{
        if(barValues[i]===null || barValues[i]===undefined) return;
        ctx.save();
        ctx.fillStyle = '#241c4d';
        ctx.font = '700 11px Inter, Arial';
        ctx.textAlign = 'center';
        const y = Math.max(bar.y - 6, chartArea.top + 10);
        ctx.fillText(barValues[i]+'%', bar.x, y);
        ctx.restore();
      });
    }
  };
  charts[id] = new Chart(el, {
    type:'bar',
    data:{labels:t.months.map(m=>m.slice(0,3)), datasets:[{label:'Marks %', data:barValues, backgroundColor:chartPalette, borderRadius:6, maxBarThickness:44}]},
    options:{responsive:true, maintainAspectRatio:false, animation:false,
      layout:{padding:{top:18}},
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true, min:0, max:100, ticks:{stepSize:20, callback:v=>v+'%', font:{family:'Inter',size:10.5}, color:'#716c94'}, grid:{color:'#ece9fa'}},
               x:{ticks:{font:{family:'Inter',size:10.5}, color:'#716c94'}, grid:{display:false}}}},

  });
}

let selectedTestName = '';
let selectedTestStandard = '';
let selectedTestStream = '';

// Jab bhi koi naya test naam pehli baar use hota he, usko creation-sequence me record kar leta he,
// taaki old-to-new order test ke naam pe guess kiye bina, actual creation order se pata chale.
function recordTestOrder(testName){
  if(!DATA.testOrder) DATA.testOrder = [];
  if(!DATA.testOrder.includes(testName)) DATA.testOrder.push(testName);
}
// Test names ko unke actual creation order me (old to new) return karta he. Purane data (jinke liye
// testOrder record nahi tha) ke naam list ke end me natural/numeric sort se add ho jaate hain.
function allTestNames(){
  const allNames = [...new Set(DATA.marks.map(m=>m.test).filter(Boolean))];
  const tracked = (DATA.testOrder||[]).filter(n=>allNames.includes(n));
  const untracked = allNames.filter(n=>!tracked.includes(n))
    .sort((a,b)=>a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
  return [...tracked, ...untracked];
}

// Rank ko colorful medal-style badge me dikhata he - top 3 ranks gold/silver/bronze
function rankBadge(rank){
  const cls = rank===1 ? 'rank-1' : rank===2 ? 'rank-2' : rank===3 ? 'rank-3' : '';
  return `<span class="rankbadge ${cls}">${rank}</span>`;
}

// Test select hote hi standard/stream aur total marks auto-detect karta he, aur students ko total obtained marks ke hisab se rank deta he
function unitTestSummary(testName, filteredStudents, subs){
  const takers = filteredStudents.filter(s=>DATA.marks.some(m=>m.roll===s.id && m.test===testName));
  const testStandards = [...new Set(takers.map(s=>s.standard).filter(Boolean))];
  const testStreams = [...new Set(takers.map(s=>s.stream).filter(Boolean))];
  const classLine = [testStandards.join(' / '), testStreams.join(' / ')].filter(Boolean).join(' &nbsp;&bull;&nbsp; ');

  // Per-subject max marks (shown in each column header) + running total
  const subjectMax = {};
  subs.forEach(sub=>{
    const rec = DATA.marks.find(m=>m.test===testName && m.subject===sub);
    subjectMax[sub] = Number(rec ? (rec.max||0) : 0);
  });
  const totalMaxMarks = subs.reduce((sum, sub)=> sum + subjectMax[sub], 0);

  // Common exam date across this test's records (blank if subjects were held on different dates)
  const testDates = [...new Set(DATA.marks.filter(m=>m.test===testName).map(m=>examDateDisplay(m)))];
  const examDate = testDates.length===1 ? testDates[0] : '';

  const studentRows = filteredStudents.map(s=>{
    let totalObt = 0, hasAny = false, anyPresent = false;
    const marksMap = {};
    subs.forEach(sub=>{
      const rec = DATA.marks.find(m=>m.roll===s.id && m.test===testName && m.subject===sub);
      if(rec){
        hasAny = true;
        if(rec.absent){ marksMap[sub] = 'AB'; }
        else { totalObt += Number(rec.obtained||0); marksMap[sub] = rec.obtained; anyPresent = true; }
      } else {
        marksMap[sub] = '-';
      }
    });
    const pct = (totalMaxMarks>0 && anyPresent) ? (totalObt/totalMaxMarks) : null;
    return { roll: s.roll, name: s.name, totalObt, hasAny, marksMap, pct };
  }).filter(r=>r.hasAny);

  const sorted = [...studentRows].sort((a,b)=> b.totalObt - a.totalObt);
  let rank = 0, prevScore = null;
  const rankRows = sorted.map((r)=>{
    if(r.totalObt !== prevScore){ rank++; prevScore = r.totalObt; }
    const grade = r.pct!==null ? gradeFor(r.pct) : null;
    return { ...r, rank, grade };
  });

  // Class-level stats for the summary strip
  const scored = rankRows.filter(r=>r.pct!==null);
  const classAvgPct = scored.length ? Math.round(scored.reduce((s,r)=>s+r.pct,0)/scored.length*100) : null;
  const highest = scored.length ? scored.reduce((a,b)=> b.totalObt>a.totalObt?b:a) : null;
  const lowest = scored.length ? scored.reduce((a,b)=> b.totalObt<a.totalObt?b:a) : null;

  return { classLine, totalMaxMarks, subjectMax, examDate, rankRows, classAvgPct, highest, lowest, appeared: rankRows.length };
}

// ---- Shared building blocks for the Unit Test Wise result table (used by both the
// in-app preview and the standalone print document, so both stay visually consistent) ----
function unitTestInfoStripHtml(testName, classLine, examDate, appeared, totalMaxMarks){
  const items = [
    ['Unit Test', testName],
    classLine ? ['Class', classLine.replace(/&nbsp;&bull;&nbsp;/g,' • ')] : null,
    examDate ? ['Exam Date', examDate] : null,
    ['Students Appeared', appeared],
    totalMaxMarks>0 ? ['Total Marks', totalMaxMarks] : null
  ].filter(Boolean);
  return `<div class="ut-info-strip">${items.map(([label,val])=>`<div class="ut-info-item"><span class="ut-info-label">${label}</span><span class="ut-info-value">${val}</span></div>`).join('')}</div>`;
}
function unitTestSyllabusHtml(chapterTopicRows){
  if(!chapterTopicRows.length) return '';
  return `<div class="ut-syllabus"><div class="ut-syllabus-title">Syllabus Covered</div><div class="table-wrap"><table><tr><th>Subject</th><th>Chapter</th><th>Topic</th></tr>${chapterTopicRows.map(r=>`<tr><td>${r.sub}</td><td>${r.chapter||'—'}</td><td>${r.topic||'—'}</td></tr>`).join('')}</table></div></div>`;
}
function unitTestTableHead(subs, subjectMax, totalMaxMarks){
  const subHeads = subs.map(s=>`<th style="text-align:center">${s}<span class="sub-max">/${subjectMax[s]||0}</span></th>`).join('');
  return `<tr><th style="text-align:center">Rank</th><th style="text-align:center">Roll</th><th style="text-align:left">Student Name</th>${subHeads}</tr>`;
}
function unitTestTableRows(subs, rankRows){
  return rankRows.map(r=>{
    const cells = subs.map(sub=> `<td style="text-align:center">${r.marksMap[sub]==='AB' ? `<span class="tag-absent">AB</span>` : r.marksMap[sub]}</td>`).join('');
    return `<tr><td style="text-align:center">${rankBadge(r.rank)}</td><td style="text-align:center">${r.roll}</td><td>${r.name}</td>${cells}</tr>`;
  }).join('');
}

function toggleAuthMode(){
  authMode = authMode==='login' ? 'signup' : 'login';
  document.getElementById('authTitle').textContent = authMode==='login' ? 'Login' : 'Sign up';
  document.getElementById('authSub').textContent = authMode==='login'

  document.getElementById('authToggle').innerHTML = authMode==='login'
    ? 'Naya account banana hai? <a onclick="toggleAuthMode()">Sign up</a>'
    : 'Pehle se account hai? <a onclick="toggleAuthMode()">Login</a>';

async function submitAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errBox = document.getElementById('authErr');
  errBox.style.display='none';
  if(!email || !password){
    errBox.textContent = 'Email aur password dono bharo.';
    errBox.style.display='block';
    return;
  }
  try{
    if(authMode==='login'){
      await auth.signInWithEmailAndPassword(email, password);
    } else {
      await auth.createUserWithEmailAndPassword(email, password);
    }
  }catch(e){
    errBox.textContent = e.message;
    errBox.style.display='block';
  }
}
function logoutUser(){
  if(!confirm('Logout karna hai?')) return;
  auth.signOut();
}

auth.onAuthStateChanged(async (user)=>{
  document.getElementById('authLoading').style.display='block';
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appRoot').style.display='none';
  currentUser = user;
  if(user){
    DATA = { students: [], marks: [], attendance: {}, workingDays: {}, dailyAttendance: {}, remarks: {}, subjects: [], school: { name:'', address:'', mobile:'', logo:'' } };
    await loadData();
    showApp();
    render();
  } else {
    showAuthScreen();
  }
});
</script>
